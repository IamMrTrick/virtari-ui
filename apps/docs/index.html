<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Virtari design foundations, React components and practical interaction guidelines." />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/virtari-logo-loader.css" />
    <script>
      try {
        const settings = JSON.parse(localStorage.getItem("virtari.docs.settings") || "{}");
        document.documentElement.dataset.theme = settings.dark === false ? "light" : "dark";
      } catch { /* The loader also works without local storage. */ }
    </script>
    <title>Virtari Design System</title>
  </head>

    <div id="root">

          <path class="virtari-splash__shape virtari-splash__shape--right" d="M1797.93 0H1233.4L554.532 1552.76H917.46C1040.36 1552.76 1152.02 1477.38 1203.45 1359.75L1797.93 0Z" />
